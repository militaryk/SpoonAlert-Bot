name: Deploy

# A restart IS the deploy: the Pterodactyl Node.js egg runs `git pull` and
# `npm install` on boot, so all this workflow has to do is prove the code is
# healthy and then ask the panel to restart the server.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch: # deploy by hand from the Actions tab

concurrency:
    # A second push supersedes one already in flight rather than queueing
    # another restart behind it.
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 18 is the floor declared in package.json engines; 22 is what
                # development happens on. Testing both means a change that only
                # works on the newer runtime cannot reach the server unnoticed.
                node-version: ['18', '22']
        steps:
            # v7 runs on the node24 runtime; v4 targeted node20, which GitHub
            # has deprecated and force-migrates with a warning on every run.
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            # 98 tests, no network and no Discord token required.
            - run: npm test

            - run: npm run lint

            - run: npm run format:check

    deploy:
        name: Deploy to Pterodactyl
        needs: test # red tests => no restart, the bot keeps running the old code
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check deploy secrets are present
              env:
                  PANEL: ${{ secrets.PTERO_PANEL_URL }}
                  SERVER: ${{ secrets.PTERO_SERVER_ID }}
                  KEY: ${{ secrets.PTERO_API_KEY }}
              run: |
                  missing=""
                  [ -n "$PANEL" ]  || missing="$missing PTERO_PANEL_URL"
                  [ -n "$SERVER" ] || missing="$missing PTERO_SERVER_ID"
                  [ -n "$KEY" ]    || missing="$missing PTERO_API_KEY"
                  if [ -n "$missing" ]; then
                    echo "::error::Missing repository secret(s):$missing"
                    echo "Set them with: gh secret set <NAME>   (see README, Deployment)"
                    exit 1
                  fi

            - name: Restart server (pulls and installs on boot)
              env:
                  PANEL: ${{ secrets.PTERO_PANEL_URL }}
                  SERVER: ${{ secrets.PTERO_SERVER_ID }}
                  KEY: ${{ secrets.PTERO_API_KEY }}
              run: |
                  # --fail-with-body turns a 401/404 into a red build carrying the
                  # panel's own error message, instead of passing silently.
                  curl -sS --fail-with-body -X POST \
                    "${PANEL%/}/api/client/servers/${SERVER}/power" \
                    -H "Authorization: Bearer ${KEY}" \
                    -H "Content-Type: application/json" \
                    -H "Accept: application/vnd.pterodactyl.v1+json" \
                    -d '{"signal":"restart"}'
                  echo "Restart requested."

            - name: Confirm a FRESH process is running
              env:
                  PANEL: ${{ secrets.PTERO_PANEL_URL }}
                  SERVER: ${{ secrets.PTERO_SERVER_ID }}
                  KEY: ${{ secrets.PTERO_API_KEY }}
                  MAX_FRESH_UPTIME_MS: '180000' # 3 minutes
              run: |
                  # Checking only for "running" is not enough: a restart takes a
                  # few seconds to bite, so an early poll can see the OLD process
                  # still running and report a success that never happened.
                  # Uptime proves the process is actually new.
                  for attempt in $(seq 1 20); do
                    sleep 10
                    body=$(curl -sS \
                      "${PANEL%/}/api/client/servers/${SERVER}/resources" \
                      -H "Authorization: Bearer ${KEY}" \
                      -H "Accept: application/vnd.pterodactyl.v1+json")
                    state=$(echo "$body" | jq -r '.attributes.current_state // "unknown"')
                    uptime_ms=$(echo "$body" | jq -r '.attributes.resources.uptime // 0')
                    echo "attempt ${attempt}: state=${state} uptime=${uptime_ms}ms"

                    if [ "$state" = "running" ] && [ "$uptime_ms" -gt 0 ] \
                       && [ "$uptime_ms" -lt "$MAX_FRESH_UPTIME_MS" ]; then
                      echo "Deployed: fresh process, up $((uptime_ms / 1000))s."
                      exit 0
                    fi
                    if [ "$state" = "offline" ] && [ "$attempt" -gt 6 ]; then
                      echo "::error::Server went offline instead of starting - check the panel console."
                      exit 1
                    fi
                  done
                  echo "::error::No fresh running process after ~200s (last: state=${state} uptime=${uptime_ms}ms)."
                  exit 1
